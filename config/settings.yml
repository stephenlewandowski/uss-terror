project:
  title: "USS Terror (CM-5): Pacific Deployment, 1943–1946"
  version: "0.4.0"
  crs: 4326
  local_host: "127.0.0.1"
  local_port: 3838

display:
  default_start_date: "1943-10-02"
  default_end_date: "1946-12-25"
  default_year: "All years"
  default_year_mode: "selected_year"
  show_disputed_routes_default: false
  show_uncertainty_default: false
  maximum_plausible_speed_knots: 23
  pacific_center_longitude: 180
  allow_online_basemaps: true

processing:
  geodesic_interval_nm: 100
  large_uncertainty_nm: 100

nautical_layers:
  openseamap:
    enabled: true
    default_visible: false
    label: "Modern OpenSeaMap seamarks — reference only"
    tile_url: "https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png"
    max_zoom: 18
    attribution: "OpenSeaMap seamark tiles (CC BY-SA 2.0); data © OpenStreetMap contributors (ODbL)"
    official_documentation: "https://wiki.openseamap.org/wiki/h:En:OpenSeaMap_in_Website"
    service_checked_utc: "2026-07-20T12:58:00Z"
    service_check: "HTTP 200 image/png for z=0/x=0/y=0; 334 bytes"

  gebco:
    enabled: true
    default_visible: false
    label: "GEBCO global bathymetric relief"
    wms_url: "https://wms.gebco.net/mapserv?"
    capabilities_url: "https://wms.gebco.net/mapserv?service=WMS&version=1.3.0&request=GetCapabilities"
    layer_name: "GEBCO_LATEST"
    opacity: 0.65
    attribution: "GEBCO Compilation Group — current GEBCO WMS"
    official_documentation: "https://www.gebco.net/data-products/gebco-web-services/web-map-service"
    service_checked_utc: "2026-07-20T12:58:00Z"
    service_check: "Capabilities HTTP 200; GEBCO_LATEST 128×128 GetMap HTTP 200 image/png"

gmrt:
  enabled: true
  map_tool_url: "https://www.gmrt.org/GMRTMapTool/"
  official_documentation: "https://www.gmrt.org/services/"
  allow_live_wms_qgis: true
  allow_live_wms_shiny: false
  cache_regional_grids: true
  default_visible: false
  use_masked_grid_default: false
  grid_format: "geotiff"
  default_resolution: "default"
  maximum_download_mb: 250
  minimum_shiny_zoom: 6
  services:
    wms_unmasked: "https://www.gmrt.org/services/mapserver/wms_merc?"
    wms_masked: "https://www.gmrt.org/services/mapserver/wms_merc_mask?"
    wms_layer_unmasked: "topo"
    wms_layer_masked: "topo"
    grid_server: "https://www.gmrt.org/services/GridServer?"
    metadata_server: "https://www.gmrt.org/services/GridServer/metadata?"
    image_server: "https://www.gmrt.org/services/ImageServer?"
  service_version: "4.5.0"
  service_release_date: "June 2026"
  service_checked_utc: "2026-07-20T12:58:00Z"
  service_check: "Both WMS capabilities returned HTTP 200; GridServer metadata returned JSON; 64-pixel ImageServer test returned image/jpeg"
  regions:
    funafuti_gilbert:
      label: "Funafuti and Gilbert Islands"
      west: 170
      east: 180
      south: -12
      north: 5
    marshall_islands:
      label: "Marshall Islands"
      west: 160
      east: 174
      south: 5
      north: 14
    marianas_ulithi:
      label: "Marianas and Ulithi"
      west: 137
      east: 147
      south: 8
      north: 22
    iwo_jima:
      label: "Iwo Jima"
      west: 140
      east: 143
      south: 23
      north: 27
    kerama_okinawa:
      label: "Kerama Retto and Okinawa"
      west: 126
      east: 129
      south: 25
      north: 28
    sasebo_western_japan:
      label: "Sasebo and western Japan"
      west: 128.5
      east: 131
      south: 32
      north: 34.5

mine_warfare:
  enabled: true
  schema_only_mode: true
  default_visible: false
  default_proximity_nm: 100
  include_planned_fields_default: false
  include_disputed_fields_default: false
  require_source_for_every_feature: true
  require_source_for_vessel_links: true
  current_navigation_warning: true
